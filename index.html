<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JM Portal</title>
<link rel="icon" type="image/png" href="jm-portal-icon.png">
<!-- Add to home screen. The manifest is what lets Android offer to install this at
     all, which it would not do while the portal was served from script.google.com
     (RBAC CLAUDE.md §26 removed the old hand-written panel partly for that reason).
     It is safe to save now for the other reason that panel was dropped: frame.js
     strips the sign-in code out of this page's address, so a saved icon can never
     carry a spent one (§52).

     apple-touch-icon is its own file, inset on an opaque ground: iOS fills a
     transparent icon with BLACK and rounds the corners off, which would eat the
     door.

     apple-mobile-web-app-capable is NOT set, and the reason first written here was
     WRONG. It said the tag would open the icon with no Safari chrome and that
     leaving it off kept the icon in an ordinary Safari tab. Modern iOS honours
     "display": "standalone" from the manifest beside it, so the icon has run
     chrome-less since the day both shipped, whatever this tag says. The round trip
     that reasoning was avoiding is one we already had.

     Tested on 2026-09-22, at the owner's hands, on an iPhone: sign-in from the icon
     goes out to Google and comes back to the dashboard, signed in, and an external
     link opens in an overlay with a back arrow and an X that returns to the portal.
     So the tag stays off because it is the deprecated spelling of something the
     manifest already does - not because it changes anything. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2556">
<meta name="apple-mobile-web-app-title" content="JM Portal">
<link rel="apple-touch-icon" sizes="180x180" href="jm-portal-icon-180.png">
<!-- JM Portal, shown inside a frame so a phone signed into several Google accounts
     can open it. See frame.js and RBAC CLAUDE.md §49. -->
<style>
  html, body { margin:0; height:100%; background:#F3F6FB; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; }
  noscript p { font:15px/1.5 -apple-system, 'Segoe UI', sans-serif; padding:24px; }
</style>
</head>
<body>
  <iframe credentialless id="app" title="JM Portal"></iframe>
  <noscript><p>JavaScript est requis. / JavaScript is required.</p></noscript>
  <script>
    window.FRAME = {
      app: 'https://script.google.com/macros/s/AKfycbw9ITLeoTRo1qI-MkmkAdPpId7GeqwT6LgL8V9igMxkPpQmVvK_WYqtwhkIcU4GuTDh/exec',
      key: 'portal',
      // Light only, like the portal itself (RBAC CLAUDE.md §44).
      prefs: ['lang'],
      bg:  { light: '#F3F6FB' },
      // The loading screen, from the portal's own door (§44): navy on the
      // dashboard's ground, its link blue for the spinner.
      ink: { light: '#0B2556' },
      acc: { light: '#1A5FC2' }
    };
  </script>
  <script src="frame.js"></script>
</body>
</html>
